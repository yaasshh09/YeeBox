name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # lavapipe, the Mesa software Vulkan driver, gives the GPU tests an
      # adapter on a runner without a GPU.
      - name: software vulkan for the gpu tests
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        # Tier 4 must run here: a missing adapter fails the job instead of
        # reporting the GPU trials as ignored.
        env:
          FDTD_REQUIRE_GPU: "1"
        run: cargo test --workspace
      - name: fdtd-core builds for wasm32 unchanged
        run: cargo build -p fdtd-core --target wasm32-unknown-unknown
      - name: fdtd-gpu and fdtd-wasm build for wasm32
        run: cargo build -p fdtd-gpu -p fdtd-wasm --target wasm32-unknown-unknown
      - name: no em dashes in tracked files
        run: |
          if git grep -nI "$(printf '\342\200\224')"; then
            echo "em dash found; the style rule forbids them"
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Pinned to the wasm-bindgen crate in Cargo.lock; they must match.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: wasm bindings
        run: npm run wasm
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build
      - name: first-load weight under 2 MB
        run: node scripts/weight.mjs
      # Headless Chromium has no WebGPU adapter, so this covers the CPU
      # fallback path; the GPU self-test page is checked in a real browser.
      - name: end to end
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: web/dist

  deploy:
    needs: [rust, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
