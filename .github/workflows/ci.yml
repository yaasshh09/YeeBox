name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: fdtd-core builds for wasm32 unchanged
        run: cargo build -p fdtd-core --target wasm32-unknown-unknown
      - name: no em dashes in tracked files
        run: |
          if git grep -nI "$(printf '\342\200\224')"; then
            echo "em dash found; the style rule forbids them"
            exit 1
          fi
