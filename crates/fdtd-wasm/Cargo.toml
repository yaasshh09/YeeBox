[package]
name = "fdtd-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "wasm-bindgen glue over fdtd-gpu and fdtd-core for the browser. No logic of its own."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fdtd-core.workspace = true
fdtd-gpu.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["console", "HtmlCanvasElement", "OffscreenCanvas"] }

# The GPU path exists only in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu.workspace = true
wasm-bindgen-futures = "0.4.80"
