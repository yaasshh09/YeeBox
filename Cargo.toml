[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
proptest = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
fdtd-core = { path = "crates/fdtd-core" }
fdtd-gpu = { path = "crates/fdtd-gpu" }
wgpu = "30.0.2"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
libtest-mimic = "0.8"
clap = { version = "4.6", features = ["derive"] }
zip = { version = "9.5", default-features = false }

# The 2D acceptance tests run long cavity and waveguide solves. Light
# optimization keeps cargo test fast; the reference code itself is unchanged.
[profile.test]
opt-level = 1
