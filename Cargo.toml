[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2"
proptest = "1"
fdtd-core = { path = "crates/fdtd-core" }
clap = { version = "4.6", features = ["derive"] }
zip = { version = "9.5", default-features = false }
